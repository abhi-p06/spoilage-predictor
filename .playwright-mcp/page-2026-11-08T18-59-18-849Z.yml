              - heading "Description" [level=2] [ref=e58]
              - paragraph [ref=e59]: (1) Everyone is interested to get fresh and quality fruits. As fruits are going to be rotten after the passing of time. Hence, fruit quality has substantial economic consequences. It is estimated that roughly one-third of the fruits are rotten causing huge financial loss. Furthermore, the sale of fruits will be impacted because consumers believe that spoiled fruits are harmful to their health. Classification of fresh and rotten fruits is usually carried out by people, which is ineffective for fruit farmers, sellers as well as fruit processing industries. (2) In the recent era, computer vision techniques are very promising in performing such types of classification and detection tasks. (3) With a view to developing computer vision-based algorithms, an extensive fruit dataset is presented containing sixteen types of fruit classes, namely fresh apple, rotten apple, fresh banana, rotten banana, fresh orange, rotten orange, fresh grape, rotten grape, fresh guava, rotten guava, fresh jujube, rotten jujube, fresh pomegranate, rotten pomegranate, fresh strawberry and rotten strawberry. Fresh and rotten classifications are done with the help of a domain expert from an agricultural institute. (4) A total of 3200 images of fresh and rotten fruits are collected from different fruit shops and real fields. Then from these original images, a total of 12335 augmented images are produced by using rotation, flipping, zooming, and shearing techniques to increase the data number.
