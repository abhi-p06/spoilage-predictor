        - generic [ref=f3e75]:
          - generic [ref=f3e76]:
            - heading "Description" [level=2] [ref=f3e77]
            - paragraph [ref=f3e78]: "This dataset, initially consisting of 10,154 high-resolution images of five fruit types—apple, banana, mango, orange, and grapes—has been expanded to over 81,000 using advanced augmentation techniques like rotation, scaling, and brightness adjustment. The images are classified into three key categories: fresh, rotten, and formalin-mixed. This dataset offers a unique opportunity for researchers in computer vision, agriculture, and food safety to develop machine learning and deep learning models for tasks such as real-time fruit quality assessment, contamination detection, and automating food inspection processes. Its extensive and diverse collection makes it a valuable resource for innovations in public health, export quality control, and agricultural productivity. (1) Everyone seeks fresh and high-quality fruits, as fruits naturally degrade over time, leading to spoilage. It is estimated that roughly one-third of harvested fruits rot, causing significant financial loss. Additionally, the sale of fruits is impacted by consumer concerns over the health risks associated with consuming spoiled or chemically treated fruits. The manual classification of fresh and rotten fruits by individuals is inefficient, particularly for farmers, sellers, and the fruit processing industry. (2) In recent years, computer vision techniques have shown great promise in automating tasks like classification and detection of fresh and rotten fruits. (3) To aid in the development of computer vision-based algorithms, we present an extensive fruit dataset containing five fruit classes: Fresh Apple, Rotten Apple, Formalin-mixed Apple, Fresh Banana, Rotten Banana, Formalin-mixed Banana, Fresh Grape, Rotten Grape, Formalin-mixed Grape, Fresh Mango, Rotten Mango, Formalin-mixed Mango, Fresh Orange, Rotten Orange, and Formalin-mixed Orange. Classification into fresh, rotten, and formalin-treated categories was carried out with the assistance of agricultural experts."
